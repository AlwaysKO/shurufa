plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.yuyan.redpacket'
    compileSdk 36
    defaultConfig {
        applicationId 'com.yuyan.redpacket'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    flavorDimensions = ['default']
    productFlavors { offline { dimension 'default' } }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility 17
        targetCompatibility 17
    }
    testOptions { unitTests.includeAndroidResources = true }
}
repositories {
    exclusiveContent {
        forRepository { maven { url 'https://api.xposed.info/' } }
        filter { includeGroup 'de.robv.android.xposed' }
    }
}
dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.20'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
apply from: rootProject.file('tools/signing-delivery.gradle')
