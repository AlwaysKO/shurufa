# Shurufa 线上站点模板。
# 将本文件复制到 /etc/nginx/conf.d/shurufa.conf，配置 TLS 证书后 reload。

upstream shurufa_backend {
    server 127.0.0.1:3000;
    keepalive 16;
}

# 手机与外部客户端 API
server {
    listen 80;
    listen [::]:80;
    server_name myapi.dog8ball.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://shurufa_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 数据管理后台
server {
    listen 80;
    listen [::]:80;
    server_name mymanage.dog8ball.com;

    root /home/ko/project/shurufa/client/dist;
    index index.html;

    # 前端保持同源 /api 请求，线上由 Nginx 转发到同一个 Node API。
    location /api/ {
        proxy_pass http://shurufa_backend;
        proxy_http_version 1.1;
        proxy_set_header Host myapi.dog8ball.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://shurufa_backend;
        proxy_set_header Host myapi.dog8ball.com;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
