server {
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/my.dog8ball.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my.dog8ball.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_name my.dog8ball.com;
    root /data/phpwww/shurufa/current/client/dist;
    index index.html;
    client_max_body_size 12m;
    auth_basic off;
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }
    location /api/v1/mobile/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:3010;
        include /etc/nginx/shurufa-proxy.conf;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        include /etc/nginx/shurufa-proxy.conf;
    }
    location /uploads/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:3010;
        include /etc/nginx/shurufa-proxy.conf;
    }
    location = /health {
        auth_basic off;
        proxy_pass http://127.0.0.1:3010;
        include /etc/nginx/shurufa-proxy.conf;
    }
    location ~ /\. { deny all; }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
    access_log /var/log/nginx/shurufa.access.log;
    error_log /var/log/nginx/shurufa.error.log;
}

server {
    listen 80;
    listen [::]:80;
    server_name my.dog8ball.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://my.dog8ball.com$request_uri; }
}
